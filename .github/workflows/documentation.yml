name: Build and Deploy Documentation

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ (github.ref != 'refs/heads/main') }}

env:
  CARGO_TERM_COLOR: always
  CARGOFLAGS: --workspace --all-targets --all-features
  RUST_LOG: warn
  SP1_PROVER: mock
  RUST_MIN_STACK: 33554432

jobs:
  build:
    name: Build and deploy documentation
    runs-on: ubicloud-standard-2
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/build-prerequisites
      - name: Clean documentation directory
        run: cargo clean --doc
      - name: Build documentation
        run: cargo doc --no-deps --all-features --document-private-items
      - name: Finalize documentation
        run: |
          echo '<meta http-equiv="refresh" content="0;url=clementine_core/index.html">' > target/doc/index.html
          touch target/doc/.nojekyll
      - name: Upload as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Documentation
          path: ./target/doc
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: target/doc
