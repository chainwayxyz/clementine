name: Circuit Check

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - "releases/*"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPR_GUEST_BUILD: 1
  BITCOIN_NETWORK: mainnet
  RISC0_TOOLCHAIN_VERSION: v1

jobs:
  circuit_check:
    name: ${{ matrix.circuit }} Method ID Check
    runs-on: ubicloud-standard-8
    strategy:
      fail-fast: false
      matrix:
        include:
          # Non-empty source_commit: rebuild that circuit from the frozen snapshot.
          # Empty source_commit: rebuild from this PR / push commit.
          - circuit: header-chain
            source_commit: 5ae25cf85ae81432a82bbc2b7b6685836cad38f9
          - circuit: work-only
            source_commit: ""
          - circuit: bridge-circuit
            source_commit: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout frozen ${{ matrix.circuit }} source
        if: matrix.source_commit != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source_commit }}
          path: circuit-source

      - name: Install risc0
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L https://risczero.com/install | bash
          export PATH="$PATH:$HOME/.risc0/bin"
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          rzup install
          rzup install rust 1.97.0

      - name: Install r0vm
        run: rzup install r0vm

      - name: Compute ${{ matrix.circuit }} pre-build method ID
        id: pre_id
        working-directory: risc0-circuits
        run: |
          PRE_ID=$(r0vm --elf elfs/mainnet-${{ matrix.circuit }}-guest.bin --id | tr -d '[:space:]')
          echo "pre_id=$PRE_ID" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.circuit }}
        if: matrix.source_commit == ''
        working-directory: risc0-circuits/${{ matrix.circuit }}
        run: cargo build -p ${{ matrix.circuit }} --release

      - name: Build ${{ matrix.circuit }} from frozen source
        if: matrix.source_commit != ''
        working-directory: circuit-source/risc0-circuits/${{ matrix.circuit }}
        run: |
          cargo build -p ${{ matrix.circuit }} --release
          ELF="target/riscv-guest/${{ matrix.circuit }}/${{ matrix.circuit }}-guest/riscv32im-risc0-zkvm-elf/docker/${{ matrix.circuit }}-guest.bin"
          if [ ! -f "$ELF" ]; then
            echo "Rebuilt ${{ matrix.circuit }} ELF not found at $ELF"
            exit 1
          fi
          cp "$ELF" "$GITHUB_WORKSPACE/risc0-circuits/elfs/mainnet-${{ matrix.circuit }}-guest.bin"

      - name: Compute ${{ matrix.circuit }} post-build method ID
        id: post_id
        working-directory: risc0-circuits
        run: |
          POST_ID=$(r0vm --elf elfs/mainnet-${{ matrix.circuit }}-guest.bin --id | tr -d '[:space:]')
          echo "post_id=$POST_ID" >> "$GITHUB_OUTPUT"

      - name: Verify ${{ matrix.circuit }} method ID unchanged
        run: |
          if [ "${{ steps.pre_id.outputs.pre_id }}" != "${{ steps.post_id.outputs.post_id }}" ]; then
            echo "${{ matrix.circuit }} method ID has changed from ${{ steps.pre_id.outputs.pre_id }} to ${{ steps.post_id.outputs.post_id }}." \
              "This PR has altered the circuit build output. Please rebuild the circuit and commit the updated artifacts."
            exit 1
          else
            echo "${{ matrix.circuit }} method ID is unchanged: ${{ steps.pre_id.outputs.pre_id }}"
          fi
