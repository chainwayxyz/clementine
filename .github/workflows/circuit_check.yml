name: Circuit Check

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - "releases/*"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  circuit_check:
    name: SP1 Guest Program Key Check
    runs-on: ubicloud-standard-16
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check SP1 crypto patches
        run: python3 scripts/check-sp1-patches.py

      - uses: ./.github/actions/install-sp1

      - name: Rebuild all guests in the pinned SP1 image
        run: python3 scripts/build_sp1_guests.py

      - name: Verify committed guests and program keys are unchanged
        run: |
          if ! git diff --exit-code -- sp1-circuits/elfs circuits-lib/src/common/sp1_programs.rs; then
            echo "This PR has altered the guest build output. Run scripts/build_sp1_guests.py and commit the updated artifacts."
            exit 1
          fi

      - name: Upload rebuilt guests on mismatch
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rebuilt-sp1-guests
          path: sp1-circuits/elfs/
          retention-days: 7
