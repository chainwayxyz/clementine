# Start required services for building Clementine.

name: Clementine Build Services
description: 'Start services required for building Clementine'

runs:
  using: "composite"

  steps:
  - name: Install Protoc
    uses: arduino/setup-protoc@v3
    with:
      repo-token: ${{ github.token }}

  # Keep the crate version, artifact digest, cache path, and cache key synchronized with
  # risc0-circuit-recursion's build.rs whenever that dependency is upgraded.
  - name: Restore RISC Zero recursion artifact
    uses: actions/cache@v4
    with:
      path: ~/.cache/risc0-circuit-recursion/4.0.5/recursion_zkr.zip
      key: risc0-circuit-recursion-4.0.5-zkr-744b999f0a35b3c86753311c7efb2a0054be21727095cf105af6ee7d3f4d8849

  - name: Verify or download RISC Zero recursion artifact
    shell: bash
    run: |
      set -euo pipefail

      readonly version="4.0.5"
      readonly expected_sha256="744b999f0a35b3c86753311c7efb2a0054be21727095cf105af6ee7d3f4d8849"
      readonly artifact_dir="$HOME/.cache/risc0-circuit-recursion/$version"
      readonly artifact="$artifact_dir/recursion_zkr.zip"
      readonly url="https://risc0-artifacts.s3.us-west-2.amazonaws.com/zkr/$expected_sha256.zip"

      verify_artifact() {
        local path="$1"
        test -f "$path" && printf '%s  %s\n' "$expected_sha256" "$path" | sha256sum --check --status
      }

      mkdir -p "$artifact_dir"
      if ! verify_artifact "$artifact"; then
        rm -f "$artifact"
        for attempt in 1 2 3 4 5; do
          temporary_artifact="$RUNNER_TEMP/recursion_zkr.$$.zip"
          rm -f "$temporary_artifact"

          if curl --fail --location --silent --show-error \
            --connect-timeout 30 \
            --max-time 600 \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            --output "$temporary_artifact" \
            "$url" && verify_artifact "$temporary_artifact"; then
            mv "$temporary_artifact" "$artifact"
            break
          fi

          rm -f "$temporary_artifact"
          echo "RISC Zero recursion artifact download or checksum verification failed (attempt $attempt/5)" >&2
          sleep $((attempt * 2))
        done
      fi

      if ! verify_artifact "$artifact"; then
        echo "Failed to obtain RISC Zero recursion artifact with SHA-256 $expected_sha256" >&2
        exit 1
      fi

      # The dependency build script verifies and copies this file instead of downloading it.
      echo "RECURSION_SRC_PATH=$artifact" >> "$GITHUB_ENV"
