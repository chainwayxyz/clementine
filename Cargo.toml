[workspace]
resolver = "2"
members = [
  "core",
  "sp1-bitvm",
  "sp1-host",
  "circuits-lib",
  "bridge-circuit-host",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "GPL-3.0"
authors = ["Chainway Labs <info@chainway.xyz>"]
homepage = "https://citrea.xyz"
publish = false
repository = "https://github.com/chainwayxyz/clementine"

[workspace.dependencies]
sp1-verifier = { version = "=6.10.0", default-features = false }
# `profiling` is enabled only to select SP1's portable executor, which does not need a large
# /dev/shm. See "Guest execution" in docs/sp1.md.
sp1-sdk = { version = "=6.10.0", default-features = false, features = ["network", "profiling"] }
sp1-zkvm = { version = "=6.10.0", features = ["verify"] }
color-eyre = "0.6.5"
ctor = "0.4.2"
hex = "0.4.3"
lazy_static = { version = "1.5.0", default-features = false }
serde = { version = "1.0.226", default-features = false, features = ["derive"] }
serde_json = "1"
thiserror = "1.0.64"
metrics = { version = "0.23.0" }
metrics-derive = { version = "0.1.0" }
metrics-exporter-prometheus = { version = "0.15.3" }
metrics-util = { version = "0.17.0" }
tracing = { version = "0.1.40", default-features = false }
tracing-subscriber = { version = "0.3.18", features = ["json"] }
log = "0.4"
jsonrpsee = { version = "0.24.2", default-features = false }
async-trait = "0.1.83"
clap = "4.5.20"
toml = "0.8.19"
sqlx = { version = "0.8.3", default-features = false }
serial_test = "3.5.0"
tempfile = "3.8"
eyre = { version = "0.6.12" }
tokio-retry = { version = "0.3" }
alloy = { version = "2.5.0", features = ["full"] }
statig = { version = "0.3.0", features = ["async", "serde"] }
pgmq = "0.30.0"
serde_with = "3.12.0"
rand_chacha = "0.9.0"
secrecy = { version = "0.10.0", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["rustls", "json", "http2", "form"], default-features = false }
semver = "1.0"

# for emergency stop encryption
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", features = ["stream"] }


# Citrea dependencies
citrea-e2e = { git = "https://github.com/chainwayxyz/citrea-e2e", rev = "fe92b4e0f23d01317b3600d02f4ff704c1dec410" }

citrea-sov-rollup-interface = { git = "https://github.com/chainwayxyz/citrea", tag = "v0.7.3-rc.5", package = "sov-rollup-interface" }

# bitcoin
bitcoin = { version = "0.32.7", features = ["serde", "base64"] }
bitcoincore-rpc = "0.18.0"
secp256k1 = { version = "0.31.0", features = [
  "serde",
  "rand",
  "std",
  "global-context",
] }
bitcoin-script = { git = "https://github.com/BitVM/rust-bitcoin-script", rev="01b4cb66cbf5b525079cabe006f9f99627da97cd" }

# async + gRPC
tonic = { version = "0.14.9", features = ["tls-ring"] }
tonic-prost = "0.14.9"
prost = "0.14.4"
tokio = { version = "1.40.0", features = ["full"] }
tokio-stream = { version = "0.1.16", features = ["sync"] }
futures = "0.3.31"
async-stream = "0.3.6"
futures-util = "0.3.31"
futures-core = "0.3.31"
http = "^1"
hyper = "^1"
tower = { version = "0.4", features = ["buffer", "limit"] }
hyper-util = { version = "0.1" }

# Circuits
sha2 = { version = "=0.10.8", default-features = false }
hkdf = { version = "0.12.4", default-features = false }
crypto-bigint = { version = "=0.5.5", features = ["rand_core"] }
borsh = { version = "1.5.1", features = ["derive"] }
k256 = { version = "=0.13.4" }
once_cell = "1.10.0"
jmt = "0.11.0"
derive_more = { version = "1.0.0", features = ["display"] }
blake3 = "1.6.1"
itertools = "0.14.0"
bitvm = { git = "https://github.com/chainwayxyz/BitVM", rev = "aeecbd9ae609aea6651e07adecdd0bc11bfd3adb" }

ark-groth16 = { version = "0.5.0", default-features = false }
ark-serialize = "0.5.0"
ark-bn254 = { version = "0.5.0", features = [
  "curve",
  "scalar_field",
], default-features = false }

# Bridge Circuit Host

ark-ff = "0.5.0"
ark-ec = "0.5.0"
ark-std = "0.5.0"
ark-crypto-primitives = "0.5.0"
ark-relations = "0.5.0"

alloy-rpc-types = "2.5.0"
alloy-primitives = "1.7.3"
alloy-rpc-types-eth = "2.5.0"
alloy-rpc-client = "2.5.0"
alloy-sol-types = { version = "1.7.3", default-features = false, features = ["json"] }


rand = "0.8"
num-bigint = "0.4.6"
num-traits = "0.2.19"
bincode = "1.3.3"
hex-literal = "0.4.1"
rustls = "0.23.27"
rustls-pki-types = "1.11.0"

base64 = "0.22.1"
vergen-git2 = { version = "10.0.3", features = [
  "build",
  "cargo",
  "rustc",
  "si",
] }

[patch.crates-io]
bitcoincore-rpc = { version = "0.18.0", git = "https://github.com/chainwayxyz/rust-bitcoincore-rpc.git", rev = "6f70f267a3c598bd1f32c6a156991762c36e7685" }
secp256k1 = { git = "https://github.com/rust-bitcoin/rust-secp256k1", rev = "4d36fefdddb118425bb9bcf611bb6e4dff306cfc" }

[profile.dev.package.backtrace]
opt-level = 3

[profile.release]
lto = true
strip = true
codegen-units = 1

# Release-mode tests: same optimizations and code paths, without the slow fat-LTO link.
[profile.ci-release]
inherits = "release"
lto = false
codegen-units = 16

# SP1 execution and key derivation must be optimized even in development.

[profile.dev.package.sp1-sdk]
opt-level = 3

[profile.dev.package.sp1-prover]
opt-level = 3

[profile.dev.package.sp1-core-executor]
opt-level = 3

[profile.dev.package.sp1-core-machine]
opt-level = 3

[profile.dev.package.sp1-hypercube]
opt-level = 3

[profile.dev.package.sp1-primitives]
opt-level = 3

[profile.dev.package.sp1-recursion-executor]
opt-level = 3

[profile.dev.package.p3-baby-bear]
opt-level = 3

[profile.dev.package.p3-poseidon2]
opt-level = 3

[profile.dev.package.p3-field]
opt-level = 3

[profile.dev.package.p3-matrix]
opt-level = 3

[profile.dev.package.p3-merkle-tree]
opt-level = 3

# BitVM script generation and execution otherwise dominate development e2e tests.

[profile.dev.package.bitvm]
opt-level = 3

[profile.dev.package.bitcoin-scriptexec]
opt-level = 3

[profile.dev.package.bitcoin-script-stack]
opt-level = 3

[profile.dev.package.sp1-bitvm]
opt-level = 3
