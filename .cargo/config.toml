[alias]
test_unit = "test --workspace --all-features -- --skip test::"
test_unit_release = "test --workspace --all-features --profile ci-release -- --skip test::"
test_integration = "test --workspace --all-features -p clementine-core test:: -- --test-threads 7"
test_integration_release = "test --profile ci-release --workspace --all-features -p clementine-core test:: -- --test-threads 7"
build_console = '''
build -p clementine-core --all-features --config build.rustflags=["--cfg","tokio_unstable"]
'''
